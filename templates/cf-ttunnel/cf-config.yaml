apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yaml: |
    tunnel: 7acb31a9-acc9-4f56-b46c-a27225f878cb
    credentials-file: /secrets/credentials.json

    ingress:
      - hostname: tunnel-api-{{ .Values.envGroup }}.rtarf-censor.dev-hubs.com
        service: http://pp-{{ .Values.envGroup }}-pp-api:80

      - hostname: tunnel-grafana-k8s.rtarf-censor.dev-hubs.com
        service: http://kube-prometheus-crds-grafana.monitoring.svc.cluster.local:80

      - service: http_status:404
