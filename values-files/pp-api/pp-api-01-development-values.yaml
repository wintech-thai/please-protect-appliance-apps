pp-api:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      - name: ENV_GROUP
        value: 'dev'

      # To solve ulimit(128) issue
      - name: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"

      - name: ASPNETCORE_ENVIRONMENT
        value: "Development"

      - name: IsDev
        value: "true"

      - name: PostgreSQL__Host
        value: "postgresql.postgresql-dev.svc.cluster.local"

      - name: PostgreSQL__Database
        value: "pp-dev"

      - name: PostgreSQL__User
        value: "postgres"

      - name: PostgreSQL__Password
        valueFrom:
          secretKeyRef:
            name: pp-postgres-secret
            key: adminPasswordKey
            optional: false

      - name: Redis__Host
        value: "redis-master.redis.svc.cluster.local"

      - name: Redis__Port
        value: "6379"

